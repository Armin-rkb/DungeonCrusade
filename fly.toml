# Fly.io: relay server + web build (Dockerfile). See platforms/README.md.
#
#   fly launch --copy-config --no-deploy   # once: creates the app from this file
#   fly deploy --ha=false                  # build + deploy ONE machine
#
# Keep exactly one machine: rooms live in the server's memory, so players on
# different machines could not find each other's room codes. Scale up the VM
# (fly scale vm ...) rather than the machine count.

app = "dungeon-crusade"
primary_region = "ams" # pick the region closest to most players

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  STATIC_DIR = "/app/dist"
  # Optional WebSocket origin allow-list. If you set it, include the native
  # clients: app://dc (Electron), https://localhost (Android),
  # capacitor://localhost (iOS) and your web origin.
  # ALLOWED_ORIGINS = "https://dungeon-crusade.fly.dev,app://dc,https://localhost,capacitor://localhost"

[http_service]
  internal_port = 8787
  force_https = true
  # Always on: a stopped relay drops every room. WebSockets work through
  # Fly's proxy without extra settings (the server pings every 10 s).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
